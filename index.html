<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PROJECT INFINITY</title>


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}


html,body{

width:100%;
height:100%;

overflow:hidden;

font-family:'Segoe UI',sans-serif;

background:#030308;

}



/* =========================
   FONDO CIUDAD CYBERPUNK
========================= */


.city-background{

position:absolute;

width:100%;

height:100%;


background:

linear-gradient(

rgba(0,0,25,.55),

rgba(0,0,5,.90)

),

url("assets/img/fondo_project_infinity.png");



background-size:cover;

background-position:center;


z-index:0;


}





/* =========================
   EDIFICIOS
========================= */


.building{

position:absolute;

bottom:0;


background:

linear-gradient(

to top,

#05050c,

#17172b

);


border:1px solid rgba(0,255,255,.35);


transition:.5s;


overflow:hidden;


}



.building:hover{


filter:

brightness(1.8)

drop-shadow(0 0 35px cyan);


}



.building::after{


content:"";


position:absolute;


top:10%;


left:15%;


width:70%;


height:80%;



background-image:


linear-gradient(

90deg,

transparent 45%,

rgba(0,255,255,.45) 50%,

transparent 55%

),


linear-gradient(

0deg,

transparent 45%,

rgba(0,200,255,.35) 50%,

transparent 55%

);



background-size:25px 25px;


}




.building-left{

left:5%;

width:18%;

height:60%;

}




.building-left2{

left:25%;

width:13%;

height:45%;

}





.building-right{

right:5%;

width:18%;

height:70%;

}





.building-right2{

right:25%;

width:13%;

height:50%;

}






/* =========================
   TORRE CENTRAL 99%
========================= */


.main-tower{


position:absolute;


top:0.5%;


bottom:0;


left:50%;


transform:translateX(-50%);



width:32%;


height:99%;



background:


linear-gradient(

rgba(10,20,45,.75),

rgba(0,0,10,.95)

);



border-left:3px solid cyan;


border-right:3px solid cyan;



box-shadow:


0 0 30px rgba(0,255,255,.5);



transition:.5s;



z-index:2;


}




/* Ventanas torre */


.main-tower::before{


content:"";


position:absolute;


inset:5%;



background-image:


linear-gradient(

90deg,

transparent 45%,

rgba(0,255,255,.45) 50%,

transparent 55%

),


linear-gradient(

0deg,

transparent 45%,

rgba(0,200,255,.35) 50%,

transparent 55%

);



background-size:30px 30px;


opacity:.7;


}





/* Brillo torre */


.main-tower:hover{


transform:

translateX(-50%)

scale(1.03);



filter:

brightness(1.6);



box-shadow:


0 0 50px cyan,


0 0 100px cyan;


}






/* =========================
   LOGO
========================= */


.logo-container{


position:absolute;


top:30px;


left:30px;



display:flex;


align-items:center;



gap:15px;



z-index:5;


}





.cat-logo{


width:90px;


height:90px;


object-fit:contain;



filter:

drop-shadow(0 0 20px cyan);


}





.logo-text{


color:white;


font-size:28px;


font-weight:bold;



letter-spacing:4px;



text-shadow:


0 0 20px cyan;


}






/* =========================
   BOTON
========================= */


.enter-button{


position:absolute;


bottom:70px;


width:100%;


text-align:center;


z-index:5;


}




.enter-button a{


text-decoration:none;


}




.enter-button button{


padding:20px 55px;


font-size:22px;


font-weight:bold;


border-radius:15px;


border:2px solid cyan;


background:rgba(5,10,30,.85);


color:white;


cursor:pointer;



box-shadow:


0 0 25px cyan;



transition:.4s;


}





.enter-button button:hover{


transform:scale(1.12);



box-shadow:


0 0 50px cyan,


0 0 90px cyan;


}



</style>


</head>



<body>



<div class="city-background"></div>



<div class="building building-left"></div>

<div class="building building-left2"></div>

<div class="building building-right"></div>

<div class="building building-right2"></div>



<div class="main-tower"></div>




<div class="logo-container">


<img class="cat-logo" src="assets/img/logo_project_infinity.png">


<div class="logo-text">

PROJECT INFINITY

</div>


</div>




<div class="enter-button">


<a href="plataforma.html">


<button>

ENTRAR A LA PLATAFORMA

</button>


</a>


</div>



</body>


</html>
