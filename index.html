<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>PROJECT INFINITY</title>


<style>


*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}



html,body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:'Segoe UI',sans-serif;

    background:#050508;

}



/* =========================
   FONDO PROJECT INFINITY
========================= */


.city-background{


    position:absolute;


    top:0;

    left:0;


    width:100%;

    height:100%;



    background-image:

    url("assets/img/fondo_project_infinity.png");



    background-size:cover;


    background-position:center;



    z-index:1;



    transition:.5s;


}



/* efecto brillo general */


.city-background:hover{


    filter:brightness(1.15);


}



/* =========================
   TORRE CENTRAL
========================= */


.main-tower{


    position:absolute;


    bottom:0;


    left:50%;


    transform:translateX(-50%);



    width:22%;


    height:92%;



    background:rgba(20,20,35,.65);



    border-top:4px solid #666;



    transition:.6s;



    z-index:3;



}



/* iluminación al pasar mouse */


.main-tower:hover{


    background:rgba(80,80,120,.75);



    box-shadow:


    0 0 40px cyan,


    0 0 90px cyan;



}



/* ventanas torre */


.tower-grid{


    position:absolute;



    top:5%;


    left:10%;



    width:80%;


    height:90%;



    background-image:



    linear-gradient(

    90deg,

    rgba(255,255,255,.15) 1px,

    transparent 1px

    ),



    linear-gradient(

    0deg,

    rgba(255,255,255,.10) 1px,

    transparent 1px

    );



    background-size:14px 14px;



}



/* =========================
   LOGO
========================= */


.logo-container{


    position:fixed;


    top:25px;


    left:30px;



    display:flex;


    align-items:center;


    gap:15px;



    z-index:10;



}



.cat-logo{


    width:95px;


    height:95px;



    object-fit:contain;



    filter:

    drop-shadow(0 0 15px cyan);



}



.logo-text{


    color:white;


    font-size:24px;


    font-weight:bold;



    letter-spacing:3px;



    text-shadow:

    0 0 10px cyan;



}
/* =========================
   BOTON ENTRAR
========================= */


.enter-button{


    position:fixed;


    bottom:50px;


    left:50%;


    transform:translateX(-50%);



    z-index:20;



}



.enter-button button{


    padding:15px 45px;



    border:none;



    border-radius:12px;



    background:#00ffff;



    color:#050508;



    font-size:18px;



    font-weight:bold;



    cursor:pointer;



    transition:.4s;



}



.enter-button button:hover{


    background:white;



    box-shadow:


    0 0 25px cyan,


    0 0 60px cyan;



}



</style>


</head>



<body>




<!-- =========================
     FONDO CIUDAD
========================= -->


<div class="city-background">



    <!-- TORRE CENTRAL -->


    <div class="main-tower">


        <div class="tower-grid"></div>


    </div>



</div>
<!-- =========================
     LOGO PROJECT INFINITY
========================= -->


<div class="logo-container">


    <img 
    src="assets/img/logo_project_infinity.png"
    class="cat-logo"
    alt="Logo Project Infinity">



    <div class="logo-text">

        PROJECT INFINITY

    </div>


</div>




<!-- =========================
     BOTON ENTRAR
========================= -->


<div class="enter-button">


    <button>

        ENTRAR A LA PLATAFORMA

    </button>


</div>




</body>

</html>
